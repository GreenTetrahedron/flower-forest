<form class="form" [formGroup]="catalogueDetails" (ngSubmit)="onSubmit()">
    <div class="form-field">
        <label class="form-name" for="name">Name: </label>
        <input class="form-text-input" formControlName="name" id="name" />
    </div>
    <button class="button form-submit-button" type="submit">{{buttonText}}</button>
</form>
