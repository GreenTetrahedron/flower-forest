<form class="form" [formGroup]="addPlantFormGroup" (ngSubmit)="submit()">
    <div class="form-field">
        <label class="form-label" for="commonName">Common name: </label>
        <input class="form-text-input" formControlName="commonName" id="commonName" />
    </div>
    <div class="form-field">
        <label class="form-label" for="genus">Genus: </label>
        <input class="form-text-input" formControlName="genus" id="genus" />
    </div>
    <div class="form-field">
        <label class="form-label" for="species">Species: </label>
        <input class="form-text-input" formControlName="species" id="species" />
    </div>
    <div class="form-field">
        <label class="form-label" for="maxHeight_metres">Max height (metres): </label>
        <input class="form-text-input" formControlName="maxHeight_metres" id="maxHeight_metres" />
    </div>
    <div class="form-field">
        <label class="form-label" for="photoUrl">Photo url: </label>
        <input class="form-text-input" formControlName="photoUrl" id="photoUrl" />
    </div>
    <button class="button form-submit-button" type="submit">Add</button>
</form>
